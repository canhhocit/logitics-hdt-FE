<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150">
  <!-- Globe circle -->
  <ellipse cx="230" cy="45" rx="50" ry="50" fill="none" stroke="#003087" stroke-width="3"/>
  <ellipse cx="230" cy="45" rx="30" ry="48" fill="none" stroke="#003087" stroke-width="2"/>
  <line x1="180" y1="45" x2="280" y2="45" stroke="#003087" stroke-width="2"/>
  <line x1="185" y1="25" x2="275" y2="25" stroke="#003087" stroke-width="1.5"/>
  <line x1="185" y1="65" x2="275" y2="65" stroke="#003087" stroke-width="1.5"/>
  <ellipse cx="230" cy="45" rx="50" ry="50" fill="#003087" fill-opacity="0.08"/>

  <!-- H letter -->
  <text x="12" y="92" font-family="Arial Black, sans-serif" font-weight="900" font-size="62" fill="#003087">H</text>
  <!-- D letter -->
  <text x="68" y="92" font-family="Arial Black, sans-serif" font-weight="900" font-size="62" fill="url(#grad1)">D</text>
  <!-- T letter -->
  <text x="130" y="92" font-family="Arial Black, sans-serif" font-weight="900" font-size="62" fill="#F97316">T</text>

  <!-- Gradient for D -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003087;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Speed lines -->
  <path d="M10 100 Q100 95 200 105" stroke="#F97316" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M20 108 Q110 102 210 112" stroke="#003087" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Company name -->
  <text x="12" y="128" font-family="Arial, sans-serif" font-size="9" fill="#003087" letter-spacing="2">CÔNG TY CỔ PHẦN</text>
  <text x="12" y="144" font-family="Arial Black, sans-serif" font-weight="900" font-size="13" fill="#003087">HDT </text>
  <text x="58" y="144" font-family="Arial Black, sans-serif" font-weight="900" font-size="13" fill="#F97316">LOGISTICS</text>
</svg>
